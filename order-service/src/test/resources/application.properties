# Testlerde gercek Postgres yerine bellek-ici H2 kullanilir.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Testlerde gercek servisler ayakta olmadigi icin sahte adresler yeterli;
# context'in ayaga kalkmasi bu degerlerin var olmasina bagli.
services.user.url=http://localhost:8082
services.product.url=http://localhost:8081
services.notification.url=http://localhost:8084
