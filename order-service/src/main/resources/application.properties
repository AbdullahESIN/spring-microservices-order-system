spring.application.name=OrderService
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Diger servislerin adresleri. Docker Compose'da bu degerler
# ortam degiskeni ile servis adlarina (http://user-service:8082) cevrilecek.
services.user.url=http://localhost:8082
services.product.url=http://localhost:8081
services.notification.url=http://localhost:8084

# ---------------------------------------------------------------
# CIRCUIT BREAKER (devre kesici)
#
# Mantik: son N cagriya bak, hata orani esigi asarsa devreyi AC.
# Devre acikken hic istek gonderilmez, aninda hata donulur (timeout beklenmez).
# Bir sure sonra devre YARI-ACIK olur: birkac deneme izni verilir.
# Basarili olurlarsa devre kapanir, olmazsa tekrar acilir.
#
# EN KRITIK AYAR: record-exceptions
# Sadece ServiceUnavailableException "ariza" sayilir. Karsi servisin
# 404/409 donmesi ariza degildir -- servis saglikli, sadece istegimiz hatali.
# Bu ayrimi yapmazsak, kullanicilar olmayan urun istedigi icin devre acilir
# ve calisan bir servise trafik gitmeyi keseriz.
# ---------------------------------------------------------------
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.record-exceptions=com.mikroservis.order.clients.ServiceUnavailableException

resilience4j.circuitbreaker.instances.userService.base-config=default
resilience4j.circuitbreaker.instances.productService.base-config=default
resilience4j.circuitbreaker.instances.notificationService.base-config=default

# ---------------------------------------------------------------
# RETRY (tekrar deneme)
# Sadece ULASILAMAMA durumunda tekrar denenir. 404/409 tekrar denenmez;
# ayni cevap gelecegi icin bosuna bekleme olur.
#
# Not: stok dusurme cagrisinda @Retry BILINCLI OLARAK kullanilmadi.
# O islem idempotent degil -- tekrar denemek stogu iki kez dusurebilir.
# ---------------------------------------------------------------
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=300ms
resilience4j.retry.configs.default.retry-exceptions=com.mikroservis.order.clients.ServiceUnavailableException

resilience4j.retry.instances.productService.base-config=default
resilience4j.retry.instances.notificationService.base-config=default

# Devre durumunu izleyebilmek icin
management.endpoints.web.exposure.include=health,circuitbreakers,retries
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
